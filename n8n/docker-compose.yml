# Optional n8n helper: automation demo/workflow ke liye use hota hai.
# Important: MOCK mode me SOC L2 Agent core ko n8n ki requirement nahi hai.
# Local start command: docker compose up -d
# First run par account setup n8n ke web interface se kiya jaata hai.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Local demo ke liye plain HTTP intentionally use kiya gaya hai; shared/public deployment me HTTPS use karna chahiye.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
